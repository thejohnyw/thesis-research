# Gated Modality Fusion — default hyperparameters

data:
  reddit_jsonl: data/raw/reddit_team_posts_bulk.jsonl
  games_csv: data/processed/games_api.csv
  features_csv: data/processed/features.csv
  out_csv: data/processed/gated_fusion_results.csv

text:
  window_hours: 48        # pre-game window for matching Reddit posts
  top_k_posts: 25         # max posts per team per game (ranked by score)
  pca_dim: 32             # PCA projection of 1152-d embeddings
  model_name: all-MiniLM-L6-v2

cv:
  n_splits: 5
  test_size: 0.2
  min_train_games: 80

training:
  hidden_dim: 64
  dropout: 0.3
  epochs: 150
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 32
  patience: 20            # early stopping on validation AUC
  n_seeds: 5              # seed averaging per model per fold
